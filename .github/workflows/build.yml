name: build

# Se lance à la main (onglet Actions > build > Run workflow) ou à chaque tag v*
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest            # binaire universel : Mac Intel + Apple Silicon
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Tests du moteur
        run: cargo test -p bandua-core
      - name: CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - name: Exe portable Windows
        if: runner.os == 'Windows'
        run: copy target\release\bandua.exe Bandua-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bandua-${{ runner.os }}
          path: |
            Bandua-portable.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
